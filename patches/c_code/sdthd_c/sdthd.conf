# File: ${IRIS_CONFIG}sdthd.conf
# Contains configuration information for the sdthd filter.
# ***********************************************************************
# - This sdthd filter can process 2bytes (16bits) RAW data only.
# - Radar TASK configuration threshold recommended to be set;
# 	Z: 	  LOG & CSR 
# 	Dual Pol: All Pass
# - Data Flow;
# 	* "sdthd.sh" to be configured as Input Pipe on IRIS/Analysis 
# 	  (specify Source directory, ex) /srv/iris_data/sdthd_in)
#	* IRIS/Radar to send RAW to ~/sdthd_in on IRIS/Analysis
#	* sdthd performs SD(PhiDP) flitering etc, then generate 
#	  output RAW with the filtered data
#	* IRIS/Analysis reads the modified RAW      
# ***********************************************************************



# Turn logging on, choices are FILE or TERM or BOTH or NONE.
LOG TERM 
# APPEND_TO_LOG

# ==== Applying 2D-SD(PhiDP) thresholding ===============================
# 	-ker <n>         : 2D volume, must be odd number 
# 	                   -ker 5 -> 5x5, -ker 7 -> 7x7
# 	                   if not specified, -ker 3 selected as default
# 	-ref1 <dtype>    : dtype must be "PHIDP"
# 	-th1 <threshold> : PHIDP 2D Standard Daviation Threshold1 (deg)
# 	-th2 <threshold> : PHIDP 2D Standard Daviation Threshold2 (deg)
# 	-ref2 <dtype>    : reference dtype to select th1 or th2
# 	-th3 <threshold> : reference dtype threshold
# 	-- <dtype1>..<dtypeN> : dtypes to be filtered
# 
# ex1) 3x3 SD(PhiDP) to DBZ & DBZE, 
#      SD(PhiDP) threshold is 10deg, if SNR >=0dB
#      SD(PhiDP) threshold is 20deg, if SNR <0dB
# SDFIL -ref1 PHIDP -th1 10 -th2 20 -ref2 SNR -th3 0 --DBZ DBZE
#
# ex2) 5x5 SD(PhiDP) to DBZ & DBZE,
#      SD(PhiDP) threshold is 12.5deg
# SDFIL -ker 5 -ref1 PHIDP -th1 12.5 -- DBZ DBZE     
# =======================================================================
SDFIL -ker 3 -ref1 PHIDP -th1 10 -th2 20 -ref2 SNR -th3 0 -- DBZ DBZE 
#SDFIL  -ref1 PHIDP -th1 12 -- DBZ

# ==== Applying 2D Speckle Filter after SD(PhiDP) process ===============
# 	-ker <n> : 2D volume, must be odd number
# 	           if not specified, -ker 3 selected as default
#
# ex) 5x5 Speckle Filter to DBZ & DBZE
# SPECKLE -ker 5 DBZ DBZE
# =======================================================================
SPECKLE DBZ DBZE
#SPECKLE  -ker 5 DBZ DBZE 

# ==== Applying 2D Median Filter (smoothing) ============================
#       -ker <n> : 2D volume, must be odd number
#                  if not specified, -ker 3 selected as default
# ex) 5x5 Median Filter to DBZ & DBZE
# MEDIAN -ker 5 DBZ DBZE
# =======================================================================
#MEDIAN -ker 5 DBZ DBZE

# ==== Applying LOG threshold ===========================================
# (PhiDP in the input RAW is recommended non-thresholded (all_pass).
# LOG threshold can be applied here, if observer needs to remove noise from
# the "all-pass" dtypes.)
# Threshold must be >0dB, and input RAW must include "SNR".
# 
# ex) LOG Threshold 1.7dB applied to ZDR & RHOHV & PHIDP & KDP
# LOGTH 1.7 ZDR RHOHV PHIDP KDP
# =======================================================================
LOGTH 2 ZDR RHOHV PHIDP KDP 

# ==== DBZE process =====================================================
# DBZE takes smaller value than DBZ in heavier precipitation. The value can 
# be corrected with equation DBZEcorr = DBZEx(ZDR^0.5)/RhoHV
#	-corr <dtype> : which dtype to be corrected (either DBTE or DBZE) 
#       -comp <dtype> : DBZE to be max_composited with dtype specified here
#       -conv <dtype> : DBZE data to be copied to the dtype specified here
# 
# ex) DBZE to be corrected, and max_composited with DBZ, then the result to 
# be copied to DBZ
# EPROCESS -corr DBZE -comp DBZ -conv DBZ
# =======================================================================
#EPROCESS DBZE -corr -comp DBZ -conv DBZ
EPROCESS DBZE -corr -comp DBZ
#EPROCESS DBZE -corr

# ==== Changing SITENAME ================================================
# SITENAME of the processed RAW can be changed (overwitten). Max 16 bytes. 
# =======================================================================
SITE TEST

