<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 · Forbidden</title>

  <style>
    :root{
      --orange:#F28C28;
      --orange2:#F6A24A;
      --navy:#14304A;
      --blue:#1F4B6E;
      --dark:#102336;
      --soft:#FFF4E8;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Inter, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(242,140,40,.28), transparent 30%),
        radial-gradient(circle at 80% 12%, rgba(31,75,110,.36), transparent 26%),
        linear-gradient(135deg, #102336 0%, #14304A 48%, #1F4B6E 100%);
      color:white;
      padding:24px;
    }

    .card{
      width:min(760px,100%);
      padding:46px;
      border-radius:34px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 34px 90px rgba(0,0,0,.38);
      backdrop-filter:blur(18px);
      text-align:center;
    }

    .logo{
      width:82px;
      height:82px;
      margin:0 auto 24px;
      border-radius:24px;
      background:white;
      display:grid;
      place-items:center;
      box-shadow:0 16px 36px rgba(0,0,0,.25);
    }

    .logo img{
      width:68px;
      height:auto;
      display:block;
    }

    .code{
      display:inline-block;
      padding:8px 16px;
      border-radius:999px;
      background:rgba(242,140,40,.16);
      color:#ffd7a8;
      font-weight:900;
      letter-spacing:.12em;
      font-size:13px;
      margin-bottom:16px;
    }

    h1{
      margin:0;
      font-size:44px;
      letter-spacing:-1.4px;
    }

    p{
      margin:14px auto 0;
      max-width:520px;
      color:rgba(255,255,255,.76);
      line-height:1.7;
      font-size:15px;
    }

    .actions{
      margin-top:28px;
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      padding:13px 18px;
      border-radius:16px;
      text-decoration:none;
      font-weight:800;
      font-size:14px;
    }

    .primary{
      background:linear-gradient(135deg,var(--orange),var(--orange2));
      color:white;
      box-shadow:0 12px 26px rgba(242,140,40,.32);
    }

    .secondary{
      background:rgba(255,255,255,.10);
      color:white;
      border:1px solid rgba(255,255,255,.18);
    }

    .footer{
      margin-top:26px;
      font-size:12px;
      color:rgba(255,255,255,.48);
    }

    @media(max-width:640px){
      .card{padding:34px 24px}
      h1{font-size:34px}
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">
      <img src="{{ url_for('static', filename='terrindo.png') }}" alt="Terrindo Logo">
    </div>

    <div class="code">403 · FORBIDDEN</div>

    <h1>Access Restricted</h1>

    <p>
      Halaman ini hanya tersedia untuk role tertentu di Terrindo One.
      Silakan kembali ke dashboard atau gunakan akun dengan akses yang sesuai.
    </p>

    <div class="actions">
      <a class="btn primary" href="{{ url_for('pages.index') }}">Back to Dashboard</a>
      <a class="btn secondary" href="{{ url_for('auth.logout') }}">Logout</a>
    </div>

    <div class="footer">
      Terrindo Bumi Raya · Internal Platform
    </div>
  </main>
</body>
</html>
